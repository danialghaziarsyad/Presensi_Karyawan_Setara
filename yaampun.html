```
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Real-Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background-color: #1a202c;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .photo-preview {
            border: 2px solid #4a5568;
            transition: all 0.3s ease;
        }

        .photo-preview:hover {
            border-color: #4299e1;
            transform: scale(1.02);
        }

        @media (max-width: 640px) {
            .responsive-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-bold text-gray-800">
                Presensi Karyawan Setara Spaghetti
            </h1>
            <p class="text-gray-600 mt-2">
                Silakan lengkapi data dan ambil foto untuk presensi
            </p>
        </header>

        <main class="max-w-4xl mx-auto">
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <div class="responsive-grid grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>
                        <h2 class="text-xl font-semibold text-gray-800 mb-4">
                            Form Presensi
                        </h2>

                        <div class="space-y-4">
                            <div>
                                <label for="nama"
                                    class="block text-sm font-medium text-gray-700 mb-1">
                                    Nama Lengkap
                                </label>
                                <input
                                    type="text"
                                    id="nama"
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>

                            <div>
                                <label for="shift"
                                    class="block text-sm font-medium text-gray-700 mb-1">
                                    Shift
                                </label>
                                <select
                                    id="shift"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option value="Pagi">Pagi (10:00-16:00)</option>
                                    <option value="Sore">Sore (16:00-22:00)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-xl font-semibold text-gray-800 mb-4">
                            Ambil Foto
                        </h2>

                        <div class="camera-container mb-4">
                            <video
                                id="camera-feed"
                                autoplay
                                playsinline
                                class="w-full">
                            </video>
                        </div>

                        <div id="photo-preview-container" class="hidden mb-4">
                            <h3 class="text-lg font-medium text-gray-700 mb-2">
                                Pratinjau Foto
                            </h3>
                            <img
                                id="photo-preview"
                                src="#"
                                alt="Pratinjau foto presensi"
                                class="photo-preview w-full rounded-lg">
                        </div>

                        <div class="flex space-x-4">
                            <button
                                type="button"
                                id="take-photo-btn"
                                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                                Ambil Foto
                            </button>

                            <button
                                type="button"
                                id="retake-photo-btn"
                                class="hidden bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                                Ambil Ulang
                            </button>
                        </div>
                    </div>
                </div>

                <button
                    type="button"
                    id="submit-btn"
                    class="mt-8 w-full bg-green-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                    Simpan Presensi
                </button>
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbxAKxU87OC1Yqa0qKyK3YsohAdMAlygvfEuJdrU81xJn6OZadSgPkIPFTz95aWmav_k/exec";

        let stream = null;
        let photoTaken = false;

        const videoElement = document.getElementById("camera-feed");
        const takePhotoBtn = document.getElementById("take-photo-btn");
        const retakePhotoBtn = document.getElementById("retake-photo-btn");
        const previewContainer = document.getElementById("photo-preview-container");
        const photoPreview = document.getElementById("photo-preview");
        const submitBtn = document.getElementById("submit-btn");
        const namaInput = document.getElementById("nama");
        const shiftInput = document.getElementById("shift");

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Browser tidak mendukung akses kamera. Buka website melalui HTTPS.");
                return;
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "user"
                    },
                    audio: false
                });

                videoElement.srcObject = stream;
                await videoElement.play();
            } catch (error) {
                console.error("Gagal mengakses kamera:", error);
                alert("Tidak dapat mengakses kamera. Pastikan izin kamera sudah diberikan.");
            }
        }

        takePhotoBtn.addEventListener("click", () => {
            if (!stream || !videoElement.videoWidth) {
                alert("Kamera belum siap. Tunggu sebentar lalu coba lagi.");
                return;
            }

            const canvas = document.createElement("canvas");
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;

            const context = canvas.getContext("2d");
            context.drawImage(
                videoElement,
                0,
                0,
                canvas.width,
                canvas.height
            );

            photoPreview.src = canvas.toDataURL("image/jpeg", 0.8);

            previewContainer.classList.remove("hidden");
            takePhotoBtn.classList.add("hidden");
            retakePhotoBtn.classList.remove("hidden");

            photoTaken = true;
        });

        retakePhotoBtn.addEventListener("click", () => {
            photoPreview.src = "#";
            previewContainer.classList.add("hidden");
            takePhotoBtn.classList.remove("hidden");
            retakePhotoBtn.classList.add("hidden");

            photoTaken = false;
        });

        submitBtn.addEventListener("click", async () => {
            const nama = namaInput.value.trim();
            const shift = shiftInput.value;

            if (!nama || !shift) {
                alert("Harap lengkapi nama dan shift!");
                return;
            }

            if (!photoTaken || !photoPreview.src.startsWith("data:image/")) {
                alert("Harap ambil foto terlebih dahulu!");
                return;
            }

            if (submitBtn.disabled) {
                return;
            }

            const payload = {
                nama: nama,
                shift: shift,
                foto: photoPreview.src
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Mengirim Presensi...";

            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=UTF-8"
                    },
                    body: JSON.stringify(payload)
                });

                alert(
                    "Permintaan presensi sudah dikirim. " +
                    "Karena keterbatasan mode no-cors, status penyimpanan belum dapat dipastikan. " +
                    "Periksa Google Sheets sebelum mengirim ulang agar tidak terjadi duplikasi."
                );
            } catch (error) {
                console.error("Gagal mengirim presensi:", error);
                alert("Pengiriman gagal. Periksa koneksi internet lalu coba kembali.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Simpan Presensi";
            }
        });

        document.addEventListener("DOMContentLoaded", startCamera);

        window.addEventListener("beforeunload", () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
```
