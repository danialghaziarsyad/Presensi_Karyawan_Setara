```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Karyawan Setara Spaghetti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background-color: #1a202c;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .photo-preview {
            border: 2px solid #4a5568;
            transition: all 0.3s ease;
        }
        .photo-preview:hover {
            border-color: #4299e1;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-bold text-gray-800">
                Presensi Karyawan Setara Spaghetti
            </h1>
            <p class="text-gray-600 mt-2">
                Silakan lengkapi data dan ambil foto untuk presensi
            </p>
        </header>

        <main class="max-w-4xl mx-auto">
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800 mb-4">
                            Form Presensi
                        </h2>

                        <div class="space-y-4">
                            <div>
                                <label for="nama"
                                    class="block text-sm font-medium text-gray-700 mb-1">
                                    Nama Lengkap
                                </label>
                                <input type="text" id="nama" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            </div>

                            <div>
                                <label for="shift"
                                    class="block text-sm font-medium text-gray-700 mb-1">
                                    Shift
                                </label>
                                <select id="shift"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                                    <option value="Pagi">Pagi (10:00-16:00)</option>
                                    <option value="Sore">Sore (16:00-22:00)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-xl font-semibold text-gray-800 mb-4">
                            Ambil Foto
                        </h2>

                        <div class="camera-container mb-4">
                            <video id="camera-feed" autoplay playsinline
                                class="w-full"></video>
                        </div>

                        <div id="photo-preview-container" class="hidden mb-4">
                            <h3 class="text-lg font-medium text-gray-700 mb-2">
                                Pratinjau Foto
                            </h3>
                            <img id="photo-preview" alt="Pratinjau foto presensi"
                                class="photo-preview w-full rounded-lg">
                        </div>

                        <div class="flex space-x-4">
                            <button type="button" id="take-photo-btn"
                                class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                                Ambil Foto
                            </button>
                            <button type="button" id="retake-photo-btn"
                                class="hidden bg-gray-300 text-gray-800 px-4 py-2 rounded-lg">
                                Ambil Ulang
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" id="submit-btn"
                    class="mt-8 w-full bg-green-600 text-white px-6 py-3 rounded-lg font-medium">
                    Simpan Presensi
                </button>

                <p id="status" class="mt-4 text-sm text-gray-700"
                    role="status" aria-live="polite"></p>
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbxAKxU87OC1Yqa0qKyK3YsohAdMAlygvfEuJdrU81xJn6OZadSgPkIPFTz95aWmav_k/exec";

        let stream = null;
        let photoTaken = false;

        const video = document.getElementById("camera-feed");
        const takeBtn = document.getElementById("take-photo-btn");
        const retakeBtn = document.getElementById("retake-photo-btn");
        const previewContainer =
            document.getElementById("photo-preview-container");
        const preview = document.getElementById("photo-preview");
        const submitBtn = document.getElementById("submit-btn");
        const statusEl = document.getElementById("status");

        async function startCamera() {
            try {
                if (!navigator.mediaDevices?.getUserMedia) {
                    throw new Error("Browser tidak mendukung akses kamera.");
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "user"
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();
            } catch (error) {
                console.error("Kamera gagal:", error);
                alert("Kamera tidak dapat dibuka. Periksa izin kamera browser.");
            }
        }

        takeBtn.addEventListener("click", () => {
            if (!stream || !video.videoWidth) {
                alert("Kamera belum siap. Tunggu sebentar lalu coba lagi.");
                return;
            }

            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            canvas.getContext("2d").drawImage(
                video, 0, 0, canvas.width, canvas.height
            );

            preview.src = canvas.toDataURL("image/jpeg", 0.8);
            previewContainer.classList.remove("hidden");
            takeBtn.classList.add("hidden");
            retakeBtn.classList.remove("hidden");
            photoTaken = true;
        });

        retakeBtn.addEventListener("click", () => {
            preview.removeAttribute("src");
            previewContainer.classList.add("hidden");
            takeBtn.classList.remove("hidden");
            retakeBtn.classList.add("hidden");
            photoTaken = false;
        });

        submitBtn.addEventListener("click", async () => {
            if (submitBtn.disabled) return;

            const nama = document.getElementById("nama").value.trim();
            const shift = document.getElementById("shift").value;

            if (!nama) {
                alert("Masukkan nama lengkap terlebih dahulu.");
                return;
            }

            if (!shift || !photoTaken || !preview.src.startsWith("data:image/")) {
                alert("Pilih shift dan ambil foto terlebih dahulu.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Mengirim...";
            statusEl.textContent = "Mengirim data presensi...";

            try {
                const payload = {
                    nama,
                    shift,
                    foto: preview.src
                };

                /*
                 * text/plain merupakan content type yang diizinkan
                 * pada request no-cors. Apps Script tetap dapat membaca
                 * isi JSON menggunakan JSON.parse(e.postData.contents).
                 */
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=UTF-8"
                    },
                    body: JSON.stringify(payload)
                });

                /*
                 * Respons no-cors bersifat opaque. Promise yang selesai
                 * bukan bukti bahwa Sheet dan Drive berhasil menyimpan data.
                 */
                statusEl.textContent =
                    "Permintaan terkirim, tetapi hasil penyimpanan belum terverifikasi. " +
                    "Periksa Sheet1 dan folder foto sebelum mencoba lagi.";

                alert(
                    "Permintaan presensi sudah dikirim. " +
                    "Penyimpanan belum dapat dipastikan. " +
                    "Periksa Google Sheet sebelum mengirim ulang."
                );
            } catch (error) {
                console.error("Pengiriman gagal:", error);
                statusEl.textContent =
                    "Pengiriman gagal atau koneksi bermasalah. Periksa koneksi dan Apps Script.";
                alert("Pengiriman gagal. Data belum dapat dipastikan tersimpan.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Simpan Presensi";
            }
        });

        window.addEventListener("DOMContentLoaded", startCamera);

        window.addEventListener("beforeunload", () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
